name: Scrape latest OpenAPI specifications

on:
  workflow_dispatch:
  schedule:
  - cron:  '27 4 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Configure Git for commits
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
    - name: GitHub
      run: |-
        mkdir -p $name
        curl https://raw.githubusercontent.com/$owner/$repo/$branch/$path | jq . > $name/$name.${path##*.}
        echo 'LATEST_COMMIT_URL='$(curl https://api.github.com/repos/$owner/$repo/commits?path=$path | jq .[0].html_url | tr -d \") >> $GITHUB_ENV
      env:
        name: github
        owner: github
        repo: rest-api-description
        branch: main
        path: descriptions/api.github.com/api.github.com.json
    - name: Commit and push if it changed
      run: |-
        git add -A
        timestamp=$(date -u)
        git commit -m "GitHub: ${timestamp}" -m "See ${LATEST_COMMIT_URL} for the latest commit before this change." || exit 0
        git push
    - name: OpenAI
      run: |-
        mkdir -p $name
        curl https://raw.githubusercontent.com/$owner/$repo/$branch/$path > $name/$name.${path##*.}
        echo 'LATEST_COMMIT_URL='$(curl https://api.github.com/repos/$owner/$repo/commits?path=$path | jq .[0].html_url | tr -d \") >> $GITHUB_ENV
      env:
        name: openai
        owner: openai
        repo: openai-openapi
        branch: master
        path: openapi.yaml
    - name: Commit and push if it changed
      run: |-
        git add -A
        timestamp=$(date -u)
        git commit -m "OpenAI: ${timestamp}" -m "See ${LATEST_COMMIT_URL} for the latest commit before this change." || exit 0
        git push
    - name: OpenLibrary
      run: |-
        mkdir -p $name
        curl -sSfL $url | jq . > $name/$name.json
      env:
        name: openlibrary
        url: https://openlibrary.org/openapi.json
    - name: Commit and push if it changed
      run: |-
        git add -A
        timestamp=$(date -u)
        git commit -m "OpenLibrary: ${timestamp}" || exit 0
        git push
    - name: Rocket.Chat
      run: |-
        mkdir -p $name
        for file in $files; do
          curl -sSfL https://raw.githubusercontent.com/$owner/$repo/$branch/$file.yaml > $name/$file.yaml
        done
        echo 'LATEST_COMMIT_URL='$(curl https://api.github.com/repos/$owner/$repo/commits?sha=$branch | jq .[0].html_url | tr -d \") >> $GITHUB_ENV
      env:
        name: rocketchat
        owner: RocketChat
        repo: Rocket.Chat-Open-API
        branch: main
        files: authentication content-management integrations marketplace-apps messaging miscellaneous notifications omnichannel rooms settings statistics user-management
    - name: Commit and push if it changed
      run: |-
        git add -A
        timestamp=$(date -u)
        git commit -m "Rocket.Chat: ${timestamp}" -m "See ${LATEST_COMMIT_URL} for the latest commit before this change." || exit 0
        git push
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: .github/workflows/scrape.yml
    - name: Open WebUI
      run: |-
        mkdir -p $name
        uv venv --python 3.12
        uv pip install open-webui --extra-index-url https://download.pytorch.org/whl/cpu
        # PYTHONHASHSEED keeps the generated operationIds of the catch-all proxy routes stable
        # The spec is written from within Python as Open WebUI logs to stdout on import
        PYTHONHASHSEED=0 DATA_DIR=$(mktemp -d) WEBUI_SECRET_KEY=dummy \
          .venv/bin/python -c "import json, sys; from open_webui.main import app; json.dump(app.openapi(), open(sys.argv[1], 'w'), indent=2)" $name/$name.json
        echo 'OPEN_WEBUI_VERSION='$(uv pip freeze | sed -n 's/^open-webui==//p') >> $GITHUB_ENV
      env:
        name: openwebui
    - name: Commit and push if it changed
      run: |-
        git add -A
        timestamp=$(date -u)
        git commit -m "Open WebUI: ${timestamp}" -m "Generated from open-webui ${OPEN_WEBUI_VERSION} on PyPI." || exit 0
        git push
